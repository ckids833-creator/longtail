<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070B0A">
<meta name="robots" content="noindex">
<title>Explore Thailand — Longtail</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- MapLibre GL JS v5 — open source, no API key. Globe projection lives here. -->
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

<link rel="stylesheet" href="theme.css">
<style>
  body{overflow:hidden;}

  /* ---------- the globe ---------- */
  #map{position:fixed;inset:0;z-index:1;background:#04070A;}
  .maplibregl-ctrl-attrib{background:rgba(7,11,10,.7)!important;backdrop-filter:blur(8px);
    font-size:10px!important;border-radius:8px 0 0 0;}
  .maplibregl-ctrl-attrib a{color:var(--faint)!important;}
  .maplibregl-ctrl-bottom-right{bottom:var(--demo-h,0px);}

  /* stars behind the globe, so "space" reads as space */
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1.4px 1.4px at 12% 22%,rgba(255,255,255,.7),transparent),
      radial-gradient(1.2px 1.2px at 68% 14%,rgba(255,255,255,.55),transparent),
      radial-gradient(1.6px 1.6px at 84% 62%,rgba(255,255,255,.6),transparent),
      radial-gradient(1.1px 1.1px at 32% 74%,rgba(255,255,255,.45),transparent),
      radial-gradient(1.3px 1.3px at 52% 42%,rgba(255,255,255,.5),transparent),
      radial-gradient(1px 1px at 8% 58%,rgba(255,255,255,.4),transparent),
      radial-gradient(1.5px 1.5px at 92% 30%,rgba(255,255,255,.5),transparent),
      radial-gradient(1px 1px at 44% 8%,rgba(255,255,255,.4),transparent);
    animation:twinkle 7s ease-in-out infinite alternate;}
  @keyframes twinkle{from{opacity:.5;}to{opacity:.95;}}

  /* ---------- map markers ---------- */
  /* The map positions each pin with position:absolute and a transform of its
     own. position:relative here stacked the pins down the page instead, and
     scaling the pin on hover replaced the map's transform - so pins sat in the
     sea, or jumped to a corner. Size and hover live on the inner parts. */
  .pin{cursor:pointer;width:36px;height:36px;display:grid;place-items:center;}
  .pin:hover{z-index:5;}
  .pin .dot{transition:transform .35s var(--ease-out);}
  .pin:hover .dot{transform:scale(1.25);}
  .pin .dot{
    width:15px;height:15px;border-radius:50%;
    background:linear-gradient(140deg,var(--green-soft),var(--green-deep));
    border:2px solid rgba(255,255,255,.8);
    box-shadow:0 3px 12px rgba(0,0,0,.7);
  }
  .pin.offline .dot{background:linear-gradient(140deg,#7C8A85,#39423F);border-color:rgba(255,255,255,.42);}
  .pin.live .ring{
    position:absolute;inset:0;border-radius:50%;border:2px solid var(--green);
    animation:ripple 2.1s var(--ease-out) infinite;
  }
  @keyframes ripple{0%{transform:scale(.42);opacity:.9;}100%{transform:scale(1.15);opacity:0;}}
  .pin .cap{
    position:absolute;top:32px;left:50%;transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.05em;
    white-space:nowrap;color:var(--paper);text-shadow:0 1px 5px #000;
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  .pin:hover .cap{opacity:1;}

  /* ---------- top-right controls ---------- */
  .mapctl{position:fixed;top:calc(var(--nav-h) + 14px);right:14px;z-index:40;
    display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .mapctl .btn{padding:11px 16px;font-size:13px;}

  /* ---------- hero copy, fades out once you land ---------- */
  .hero{position:fixed;left:clamp(16px,4vw,46px);top:calc(var(--nav-h) + 8vh);z-index:20;
    max-width:min(430px,74vw);pointer-events:none;
    transition:opacity .9s var(--ease),transform .9s var(--ease-out);}
  .hero.gone{opacity:0;transform:translateY(-16px);}
  .hero h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;text-transform:uppercase;
    font-size:clamp(42px,7.4vw,86px);line-height:.85;text-shadow:0 6px 40px rgba(0,0,0,.9);}
  .hero h1 em{font-style:normal;color:var(--green);}
  .hero p{margin-top:16px;font-size:clamp(13.5px,1.6vw,16px);color:var(--dim);line-height:1.7;
    text-shadow:0 2px 18px rgba(0,0,0,.9);}
  .hero .word{display:inline-block;opacity:0;transform:translateY(28px);
    animation:rise .95s var(--ease-out) forwards;}
  @keyframes rise{to{opacity:1;transform:none;}}

  /* ---------- the glass command bar ---------- */
  .cmd{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(22px + var(--demo-h,0px) + env(safe-area-inset-bottom));
    z-index:45;width:min(760px,calc(100vw - 24px));
    border-radius:var(--r-xl);padding:14px;
    animation:cmd-in 1.1s var(--ease-out) .5s backwards;
  }
  @keyframes cmd-in{from{opacity:0;transform:translate(-50%,34px);}to{opacity:1;transform:translate(-50%,0);}}
  .cmd-row{display:flex;gap:10px;align-items:center;}
  .searchwrap{position:relative;flex:1;min-width:0;}
  .searchwrap .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);
    font-size:15px;opacity:.5;pointer-events:none;}
  #q{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--glass-line);
    border-radius:999px;padding:15px 16px 15px 44px;color:var(--paper);font-size:15px;
    transition:border-color .25s,background .25s,box-shadow .25s;}
  #q::placeholder{color:var(--faint);}
  #q:focus{outline:none;border-color:var(--green);background:rgba(87,211,146,.07);
    box-shadow:0 0 0 3px var(--glow-soft);}

  .results{
    position:absolute;left:0;right:0;bottom:calc(100% + 12px);
    max-height:min(46vh,420px);overflow-y:auto;border-radius:var(--r-md);
    background:rgba(12,18,17,.9);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--glass-line);box-shadow:0 30px 70px -24px rgba(0,0,0,.95);
    opacity:0;transform:translateY(10px);pointer-events:none;transition:all .32s var(--ease-out);
  }
  .results.on{opacity:1;transform:none;pointer-events:auto;}
  .rgroup{padding:10px 14px 4px;font-family:'JetBrains Mono',monospace;font-size:9.5px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--faint);}
  .ritem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:11px 14px;transition:background .2s;}
  .ritem:hover,.ritem:focus-visible{background:rgba(87,211,146,.1);}
  .ritem .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    font-size:16px;background:rgba(255,255,255,.06);flex-shrink:0;}
  .ritem .t{flex:1;min-width:0;}
  .ritem .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .ritem .t span{font-size:11.5px;color:var(--faint);}
  .rempty{padding:20px 16px;font-size:13px;color:var(--faint);text-align:center;}

  .cmd-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:12px;padding:0 6px;font-size:11.5px;color:var(--faint);}
  .cmd-meta .live{font-size:9.5px;}

  @media (max-width:700px){
    .cmd-row{flex-wrap:wrap;}
    .searchwrap{flex:1 1 100%;order:1;}
    #joinBtn{flex:1 1 100%;order:2;}
    .hero{top:calc(var(--nav-h) + 4vh);}
    .hero p{display:none;}
    .navlinks .navlink{padding:9px 10px;font-size:12.5px;}
    .brand b{display:none;}
  }

  /* ---------- guide cards inside the drawer ---------- */
  .gcard{display:block;width:100%;text-align:left;border-radius:var(--r-md);padding:15px;
    margin-bottom:11px;background:var(--glass);border:1px solid var(--glass-line);cursor:pointer;}
  .gcard-top{display:flex;gap:12px;align-items:flex-start;}
  .gcard-top .t{flex:1;min-width:0;}
  .gcard-top .t h3{font-size:15.5px;font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .gcard-top .t .where{font-size:11.5px;color:var(--faint);margin-top:3px;}
  .gcard .topic{font-size:13.5px;color:var(--dim);line-height:1.55;margin-top:11px;}
  .gcard .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  .gcard .price{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--green-soft);}
  .gcard .price span{color:var(--faint);font-size:10.5px;}
  .tags{display:flex;gap:5px;flex-wrap:wrap;}

  .drawer-filter{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}

  /* ---------- detail sheet internals ---------- */
  .dt-hero{display:flex;gap:14px;align-items:center;margin-bottom:18px;}
  .dt-hero .t h2{font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    text-transform:uppercase;font-size:26px;line-height:1;}
  .dt-hero .t p{font-size:12.5px;color:var(--faint);margin-top:5px;}
  .dt-prof{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .dt-prof > span:last-child{font-size:12.5px;color:var(--green-soft);}
  .dt-prof:hover > span:last-child{text-decoration:underline;}
  .dt-topic{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:10px;}
  .dt-blurb{font-size:14px;color:var(--dim);line-height:1.75;margin-bottom:18px;}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:9px;margin-bottom:18px;}
  .fact{border-radius:var(--r-sm);padding:12px 13px;background:rgba(255,255,255,.04);
    border:1px solid var(--line);}
  .fact .k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);}
  .fact .v{font-size:15px;font-weight:650;margin-top:5px;}
  .fact .v.green{color:var(--green-soft);}

  .steps{display:flex;gap:9px;align-items:center;margin-bottom:16px;}
  .dur{flex:1;border-radius:var(--r-sm);padding:13px 10px;text-align:center;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid var(--glass-line);transition:all .28s var(--ease);}
  .dur:hover{border-color:rgba(87,211,146,.42);}
  .dur.on{background:rgba(87,211,146,.14);border-color:var(--green);}
  .dur b{display:block;font-size:16px;font-weight:700;}
  .dur span{display:block;font-size:11px;color:var(--faint);margin-top:3px;}
  .dur.on span{color:var(--green-soft);}

  .total{display:flex;align-items:baseline;justify-content:space-between;
    padding:15px 16px;border-radius:var(--r-md);background:rgba(87,211,146,.08);
    border:1px solid rgba(87,211,146,.24);margin-bottom:6px;}
  .total .k{font-size:13px;color:var(--dim);}
  .total .v{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:32px;color:var(--green-soft);}

  .note{border-radius:var(--r-sm);padding:13px 15px;font-size:12.5px;line-height:1.65;
    background:rgba(232,163,61,.09);border:1px solid rgba(232,163,61,.26);color:var(--saffron);}
  .note.plain{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--dim);}

  .codebig{width:100%;text-align:center;font-family:'JetBrains Mono',monospace;
    font-size:22px;letter-spacing:.18em;text-transform:lowercase;padding:19px 16px;}

  .stack > * + *{margin-top:10px;}
</style>
</head>
<body>

<div id="stars"></div>
<div id="map" role="application" aria-label="Map of Thailand"></div>

<!-- hero -->
<div class="hero" id="hero">
  <h1>
    <span class="word" style="animation-delay:.15s">See</span>
    <span class="word" style="animation-delay:.28s">Thailand</span><br>
    <span class="word" style="animation-delay:.41s"><em>through</em></span>
    <span class="word" style="animation-delay:.54s"><em>someone</em></span>
    <span class="word" style="animation-delay:.67s"><em>walking</em></span>
    <span class="word" style="animation-delay:.80s"><em>it.</em></span>
  </h1>
  <p class="word" style="animation-delay:1.0s">
    Pay by the minute. You steer — turn left, get closer, what’s that.
    They carry the phone. Nothing is recorded.
  </p>
</div>

<!-- map controls -->
<div class="mapctl">
  <button class="btn btn-glass" id="hereBtn" type="button">◎ Live guides on map</button>
</div>

<!-- command bar -->
<div class="cmd glass">
  <div class="cmd-row">
    <div class="searchwrap">
      <span class="mag">⌕</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search a place — Yaowarat, Chiang Mai, a temple…"
             aria-label="Search places and guides" aria-expanded="false" aria-controls="results">
      <div class="results" id="results" role="listbox"></div>
    </div>
    <button class="btn btn-primary" id="joinBtn" type="button">See who’s walking</button>
  </div>
  <div class="cmd-meta">
    <span class="live"><i></i><span id="liveCount">—</span> walking now</span>
    <span>฿15 / minute · you can end any time</span>
  </div>
</div>

<!-- ============ drawer: live guides ============ -->
<div class="scrim" id="scrim"></div>

<aside class="sheet right" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="sheet-head">
    <div>
      <h2 id="drawerTitle">Who’s out there</h2>
      <p id="drawerSub">Guides on the street right now, and what they’re walking.</p>
    </div>
    <button class="x" data-close type="button" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body">
    <div class="drawer-filter" id="dFilter"></div>
    <div id="gList"></div>
  </div>
</aside>

<!-- ============ guide detail + booking ============ -->
<div class="sheet center" id="detail" role="dialog" aria-modal="true" aria-labelledby="dtTitle">
  <div class="sheet-head">
    <div><h2 id="dtTitle">Walk</h2><p id="dtSub"></p></div>
    <button class="x" data-close type="button" aria-label="Close">✕</button>
  </div>
  <div class="sheet-body" id="dtBody"></div>
  <div class="sheet-foot" id="dtFoot"></div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
LT.start('explore').then(function(account){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The directory comes from the Worker. This resolves either way — a backend
  // that is down falls back to the sample rows bundled in data.js.
  // The globe shows people who are walking right now, at the position their
  // phone is reporting. A guide who is not streaming is not on it — a pin you
  // cannot join is worse than no pin.
  var dataReady = LT.load({ liveOnly: true }).then(function(state){
    LT.refreshDemoBar();
    $('liveCount').textContent = LT.liveGuides().length;
    if (!state.online) LT.toast('Live directory unavailable — showing sample guides.', 'bad');
    return state;
  });

  /* =========================================================
     1. The globe
     ========================================================= */
  var map, markers = [], landed = false;

  try {
    map = new maplibregl.Map({
      container: 'map',
      // CARTO dark matter: open vector style, no key. Attribution is required.
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: LT.THAILAND_CENTER,
      zoom: reduced ? 5.1 : 0.75,
      attributionControl: { compact: true },
      dragRotate: false,
      pitchWithRotate: false,
      maxZoom: 16
    });
  } catch (e) {
    mapFailed('This browser could not start the map.');
  }

  function mapFailed(msg){
    var el = $('map');
    if (el) el.style.background =
      'radial-gradient(circle at 50% 45%, #0f2a20 0%, #071110 46%, #04070A 74%)';
    LT.toast(msg + ' Search still works.', 'bad');
  }

  /* Thailand only. The arrival flies in from space, and nobody can steer the
     globe somewhere else on the way: input is off until the camera lands,
     and a tap just lands it sooner. After that the camera's centre cannot
     leave Thailand, it cannot zoom out past the country, the rest of the
     world is dimmed, and a tap outside Thailand does nothing but say so. */
  var HANDLERS = ['dragPan', 'scrollZoom', 'boxZoom', 'keyboard', 'doubleClickZoom', 'touchZoomRotate'];
  function setInput(on){
    HANDLERS.forEach(function(h){ if (map[h]) map[h][on ? 'enable' : 'disable'](); });
  }
  /** Is this somewhere a pin may sit? A little slack for the outline's rough edges. */
  function onMap(g){ return LT.inThailand(g.lng, g.lat, 15); }

  if (map) {
    setInput(false);
    map.getCanvasContainer().addEventListener('pointerdown', function(){ if (!landed) land(true); });
    map.addControl(new maplibregl.NavigationControl({ showCompass:false }), 'bottom-right');
    map.on('error', function(e){
      // style/tile failures should not take the page down
      if (e && e.error && /style|fetch|load/i.test(String(e.error.message||''))) {
        mapFailed('Map tiles did not load.');
      }
    });
    map.on('load', onMapLoad);
    window.LTMAP = map; // handy when debugging the globe from the console
  }

  // Each decoration is optional. A version of MapLibre that lacks one of these
  // must not take the markers down with it — the pins are the functional part.
  function attempt(what, fn){
    try { fn(); } catch (e) { console.warn('[explore] ' + what + ' unavailable:', e.message); }
  }

  function onMapLoad(){
    // space around the planet
    attempt('globe projection', function(){
      if (map.setProjection) map.setProjection({ type:'globe' });
    });
    attempt('sky', function(){
      if (!map.setSky) return;
      map.setSky({
        'sky-color':'#050A12',
        'horizon-color':'#0C2A22',
        'fog-color':'#04070A',
        'sky-horizon-blend':0.55,
        'horizon-fog-blend':0.45,
        'fog-ground-blend':0.55
      });
    });

    // Everywhere else, dimmed: it is on the map for context, not to visit.
    attempt('outside mask', function(){
      map.addSource('outside', { type:'geojson', data: LT.OUTSIDE_THAILAND_GEOJSON });
      map.addLayer({ id:'outside', type:'fill', source:'outside',
        paint:{ 'fill-color':'#04070A', 'fill-opacity':0.66 } });
    });

    // Thailand highlight
    attempt('country outline', function(){
      map.addSource('th', { type:'geojson', data: LT.THAILAND_GEOJSON });
      map.addLayer({ id:'th-fill', type:'fill', source:'th',
        paint:{ 'fill-color':'#57D392', 'fill-opacity':0.09 } });
      map.addLayer({ id:'th-glow', type:'line', source:'th',
        paint:{ 'line-color':'#57D392', 'line-width':7, 'line-opacity':0.13, 'line-blur':6 } });
      map.addLayer({ id:'th-line', type:'line', source:'th',
        paint:{ 'line-color':'#8FE3AC', 'line-width':1.6, 'line-opacity':0.85 } });
    });

    dataReady.then(addMarkers);

    if (reduced) { land(); return; }
    // the arrival
    setTimeout(function(){
      map.flyTo({ center: LT.THAILAND_CENTER, zoom: 5.15, speed: 0.55, curve: 1.35,
                  essential: true, duration: 4200 });
    }, 700);
    map.once('moveend', land);
    setTimeout(land, 6000); // belt and braces if moveend never fires
  }

  // now === true: skip the rest of the arrival (a tap, or a pin opened mid-flight).
  // Called from 'moveend' it gets an event object, which is not a skip.
  function land(now){
    if (landed) return;
    landed = true;
    now = now === true;
    $('hero').classList.add('gone');
    if (now) map.jumpTo({ center: LT.THAILAND_CENTER, zoom: 5.15 });
    // From here on, the camera stays over Thailand.
    fitFloor();
    map.transformCameraUpdate = keepOverThailand;
    setInput(true);
    if (!now) map.flyTo({ center: LT.THAILAND_CENTER, zoom: Math.max(map.getZoom(), map.getMinZoom()) });
  }

  /* Every camera move - a drag, a pinch, a fly-to - passes through here.
     Two rules. The screen stays framed on Thailand's extent: zoomed out, you
     cannot slide sideways into a neighbour; zoomed in, you can go right up
     to the border. And the centre never sits over another country, even
     zoomed in on a border town, beyond a little slack for the outline. */
  var VIEW = [[96.6, 5.0], [106.4, 21.0]];   // Thailand, plus a little sea and border
  function within(v, lo, hi){ return lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, v)); }
  function keepOverThailand(next){
    var lng = next.center.lng, lat = next.center.lat, slack = 30;
    try {
      var b = next.getBounds();
      var hw = (b.getEast() - b.getWest()) / 2, hh = (b.getNorth() - b.getSouth()) / 2;
      lng = within(lng, VIEW[0][0] + hw, VIEW[1][0] - hw);
      lat = within(lat, VIEW[0][1] + hh, VIEW[1][1] - hh);
      // How far past the border the centre may go scales with the view: wide
      // enough zoomed out to pan across the sea to the islands, a couple of
      // kilometres zoomed in, so a border never fills the screen.
      var hwKm = hw * 111.32 * Math.cos(lat * Math.PI / 180);
      slack = Math.max(2, Math.min(30, hwKm * 0.1));
    } catch (e) { /* an older map without getBounds: the centre rule still holds */ }
    var c = LT.clampToThailand(lng, lat, slack);
    if (c) { lng = c[0]; lat = c[1]; }
    return (lng !== next.center.lng || lat !== next.center.lat)
      ? { center: new maplibregl.LngLat(lng, lat) } : {};
  }

  /* The furthest you can zoom out is "all of Thailand on this screen", worked
     out per screen: a phone and a wide monitor need different numbers. */
  function fitFloor(){
    var cam = map.cameraForBounds(LT.THAILAND_BOUNDS, { padding: 24 });
    map.setMinZoom(Math.max(3, (cam && cam.zoom ? cam.zoom : 4.4) - 0.25));
  }
  window.addEventListener('resize', function(){ if (map && landed) fitFloor(); });

  if (map) map.on('click', function(e){
    if (!landed) return;
    if (!LT.inThailand(e.lngLat.lng, e.lngLat.lat, 8)) {
      LT.toast('Longtail walks are in Thailand only.');
    }
  });

  var markerById = {};

  function addMarkers(){
    markers.forEach(function(m){ m.remove(); });
    markers = [];
    markerById = {};
    LT.GUIDES.filter(onMap).forEach(function(g){
      var el = document.createElement('div');
      el.className = 'pin ' + (g.live ? 'live' : 'offline');
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.setAttribute('aria-label', g.name + ' — ' + g.area + (g.live ? ', live now' : ', offline'));
      el.innerHTML = (g.live ? '<span class="ring"></span>' : '') +
                     '<span class="dot"></span>' +
                     '<span class="cap">' + LT.esc(g.name) + ' · ' + LT.esc(g.city) + '</span>';
      var open = function(ev){ ev.stopPropagation(); openGuide(g.id); };
      el.addEventListener('click', open);
      el.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(ev); }
      });
      var marker = new maplibregl.Marker({ element: el }).setLngLat([g.lng, g.lat]).addTo(map);
      markers.push(marker);
      markerById[g.id] = marker;
    });
  }

  /* Follow them down the street. The phone reports every 15s while walking, so
     poll a little faster than that and slide the pin rather than redrawing it. */
  function refreshLive(){
    if (document.hidden) return;
    LT.load({ liveOnly: true }).then(function(state){
      if (!state.online) return;
      $('liveCount').textContent = LT.liveGuides().length;
      var seen = {};
      LT.GUIDES.forEach(function(g){
        seen[g.id] = true;
        if (markerById[g.id]) markerById[g.id].setLngLat([g.lng, g.lat]);
      });
      // Someone who stopped walking leaves the globe immediately.
      var vanished = Object.keys(markerById).filter(function(id){ return !seen[id]; });
      if (vanished.length || LT.GUIDES.some(function(g){ return onMap(g) && !markerById[g.id]; })) {
        addMarkers();
        if (drawerOpen()) renderDrawer();
      }
    });
  }
  function drawerOpen(){ return $('drawer').classList.contains('on'); }
  setInterval(refreshLive, 12000);

  function flyToPoint(lng, lat, zoom){
    if (!map) return;
    if (!landed) land(true);
    // Somewhere outside Thailand is not a place this map goes.
    if (!LT.inThailand(lng, lat, 15)) return;
    map.flyTo({ center:[lng,lat], zoom: zoom || 12.4, speed: 0.85, curve: 1.5, essential: true });
  }

  $('hereBtn').onclick = function(){
    var live = LT.liveGuides().filter(onMap);
    if (!live.length) { LT.toast('Nobody is walking right now.'); return; }
    if (!map) return;
    if (!landed) land(true);
    var b = new maplibregl.LngLatBounds();
    live.forEach(function(g){ b.extend([g.lng, g.lat]); });
    map.fitBounds(b, { padding:{ top:150, bottom:230, left:80, right:80 }, maxZoom:11, duration:1800 });
  };

  /* =========================================================
     2. Sheets
     ========================================================= */
  var openSheets = [];
  function show(id){
    $(id).classList.add('on');
    $('scrim').classList.add('on');
    if (openSheets.indexOf(id) === -1) openSheets.push(id);
  }
  function hide(id){
    $(id).classList.remove('on');
    openSheets = openSheets.filter(function(x){ return x !== id; });
    if (!openSheets.length) $('scrim').classList.remove('on');
  }
  function hideTop(){ if (openSheets.length) hide(openSheets[openSheets.length-1]); }

  $('scrim').onclick = function(){ while (openSheets.length) hide(openSheets[openSheets.length-1]); };
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.onclick = function(){ hide(b.closest('.sheet').id); };
  });
  LT.escClose(hideTop);

  /* =========================================================
     3. Live-guide drawer
     ========================================================= */
  var filter = 'live';

  function guideCard(g){
    var demo = LT.DEMO_MODE && !g.real ? '<span class="demo-badge">demo</span>' : '';
    return '<button class="gcard glass-hover" data-guide="' + g.id + '" type="button">' +
      '<div class="gcard-top">' +
        LT.avatar(g) +
        '<span class="t">' +
          '<h3>' + LT.esc(g.name) + demo +
            (g.live ? '<span class="live"><i></i>live</span>' : '<span class="tag">offline</span>') +
          '</h3>' +
          '<div class="where">' + LT.esc(g.area) + ' · ' + LT.esc(g.city) + '</div>' +
        '</span>' +
      '</div>' +
      '<p class="topic">' + LT.esc(g.topic) + '</p>' +
      '<div class="foot">' +
        '<span class="tags">' + g.tags.slice(0,2).map(function(t){
          return '<span class="tag">' + LT.esc(t) + '</span>'; }).join('') + '</span>' +
        '<span class="price">' + LT.baht(g.rate) + '<span>/min</span></span>' +
      '</div>' +
    '</button>';
  }

  function renderDrawer(){
    var list = filter === 'live' ? LT.liveGuides() : LT.GUIDES;
    $('dFilter').innerHTML =
      '<button class="chip' + (filter==='live'?' on':'') + '" data-f="live" type="button">' +
        'Live now · ' + LT.liveGuides().length + '</button>' +
      '<button class="chip' + (filter==='all'?' on':'') + '" data-f="all" type="button">' +
        'All guides · ' + LT.GUIDES.length + '</button>';
    $('gList').innerHTML = list.length
      ? list.map(guideCard).join('')
      : '<div class="rempty">' + (LT.GUIDES.length === 0
          ? 'No guides have joined yet.'
          : 'Nobody is walking right now. Try “All guides”.') + '</div>';

    $('dFilter').querySelectorAll('[data-f]').forEach(function(b){
      b.onclick = function(){ filter = b.dataset.f; renderDrawer(); };
    });
    $('gList').querySelectorAll('[data-guide]').forEach(function(b){
      b.onclick = function(){ openGuide(b.dataset.guide); };
    });
  }

  $('joinBtn').onclick = function(){ renderDrawer(); show('drawer'); };

  /* =========================================================
     4. Guide detail + booking
     ========================================================= */
  var current = null, minutes = LT.PILOT_MINUTES;

  function openGuide(id){
    var g = LT.guide(id);
    if (g) openGuideRow(g);
  }

  function openGuideRow(g){
    current = g;
    minutes = LT.PILOT_MINUTES;
    flyToPoint(g.lng, g.lat, 13);
    renderDetail();
    show('detail');
  }

  function renderDetail(){
    var g = current;
    var demo = LT.DEMO_MODE && !g.real;
    $('dtTitle').textContent = g.name + ' — ' + g.city;
    $('dtSub').textContent = g.area;

    $('dtBody').innerHTML =
      '<div class="dt-hero">' +
        LT.avatar(g, 'lg') +
        '<span class="t">' +
          '<h2>' + LT.esc(g.name) + '</h2>' +
          '<p>' + (g.live ? 'Walking right now' : 'Not walking at the moment') +
            ' · ' + LT.esc(g.langs.join(' / ')) + '</p>' +
          '<a class="dt-prof" href="' + LT.profileUrl(g.id) + '">' +
            LT.stars(g.rating, g.review_count) + '<span>Full profile & reviews →</span></a>' +
        '</span>' +
        (demo ? '<span class="demo-badge">demo guide</span>' : '') +
      '</div>' +

      '<p class="dt-topic">' + LT.esc(g.topic) + '</p>' +
      (g.blurb ? '<p class="dt-blurb">' + LT.esc(g.blurb) + '</p>' : '') +

      '<div class="label">How long</div>' +
      '<div class="steps" id="durs">' +
        [15, 25, 45].map(function(m){
          return '<button class="dur' + (m===minutes?' on':'') + '" data-m="' + m + '" type="button">' +
            '<b>' + m + ' min</b><span>' + LT.baht(m * g.rate) + '</span></button>';
        }).join('') +
      '</div>' +

      // What happens next, in one line. The walk page takes it from here.
      '<p class="hint" style="margin:14px 0 0">' + LT.esc(g.name.split(' ')[0]) +
        ' gets your request and answers. You join from the next screen once they say yes. ' +
        'Nothing is charged — payments aren’t connected yet.</p>';

    // No "join now": a walk is one guide and one traveller, so the way in is a
    // request the guide accepts. Offering a button the server refuses would
    // just teach people the app is broken.
    $('dtFoot').innerHTML =
      '<button class="btn btn-primary btn-block" id="reserve" type="button">' +
        'Request ' + minutes + ' min · ' + LT.baht(minutes * g.rate) +
      '</button>';

    $('durs').querySelectorAll('[data-m]').forEach(function(b){
      b.onclick = function(){ minutes = +b.dataset.m; renderDetail(); };
    });
    $('reserve').onclick = reserve;
  }

  function reserve(){
    var g = current, mins = minutes;
    var btn = $('reserve');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    // No card is collected anywhere in this flow. The booking row records what
    // was asked for and holds nothing. The traveller's name comes from the
    // signed-in account, not from anything typed here.
    LT.api('POST', '/api/bookings', { guide_id: g.id, minutes: mins })
      .then(function(res){
        // Straight to the walk page, which waits for the answer and lets them
        // in. Asking again for the same guide lands on the same request.
        location.href = LT.walkUrl(res.booking.id);
      })
      .catch(function(err){
        btn.disabled = false;
        btn.textContent = 'Request ' + mins + ' min · ' + LT.baht(mins * g.rate);
        LT.toast(err.message, 'bad');
      });
  }

  /* =========================================================
     5. Search
     ========================================================= */
  var qEl = $('q'), rEl = $('results'), tmr;

  qEl.addEventListener('input', function(){
    clearTimeout(tmr);
    tmr = setTimeout(runSearch, 120);
  });
  qEl.addEventListener('focus', function(){ if (qEl.value.trim()) runSearch(); });
  document.addEventListener('click', function(e){
    if (!e.target.closest('.searchwrap')) closeResults();
  });
  qEl.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { closeResults(); qEl.blur(); }
    if (e.key === 'Enter'){
      var first = rEl.querySelector('.ritem');
      if (first) first.click();
    }
  });

  function closeResults(){
    rEl.classList.remove('on');
    qEl.setAttribute('aria-expanded','false');
  }

  function runSearch(){
    var q = qEl.value.trim();
    if (!q) { closeResults(); return; }
    var res = LT.search(q), html = '';

    if (res.places.length){
      html += '<div class="rgroup">Places</div>';
      html += res.places.map(function(p){
        return '<button class="ritem" data-place="' + p.id + '" type="button">' +
          '<span class="ico">' + p.icon + '</span>' +
          '<span class="t"><b>' + LT.esc(p.name) + '</b>' +
            '<span>' + LT.esc(p.city) + ' · ' + LT.esc(p.cat) + '</span></span>' +
          '<span class="tag">Fly to</span></button>';
      }).join('');
    }
    if (res.guides.length){
      html += '<div class="rgroup">Guides</div>';
      html += res.guides.map(function(g){
        return '<button class="ritem" data-guide="' + g.id + '" type="button">' +
          LT.avatar(g, 'sm') +
          '<span class="t"><b>' + LT.esc(g.name) + '</b>' +
            '<span>' + LT.esc(g.area) + ' · ' + LT.esc(g.city) + '</span></span>' +
          (g.live ? '<span class="live"><i></i>live</span>' : '<span class="tag">offline</span>') +
          '</button>';
      }).join('');
    }
    if (!html) html = '<div class="rempty">Nothing matched “' + LT.esc(q) + '”.</div>';

    rEl.innerHTML = html;
    rEl.classList.add('on');
    qEl.setAttribute('aria-expanded','true');

    rEl.querySelectorAll('[data-place]').forEach(function(b){
      b.onclick = function(){
        var p = LT.place(b.dataset.place);
        closeResults(); qEl.blur();
        flyToPoint(p.lng, p.lat, 13.2);
        LT.toast(p.name + ' — ' + LT.guidesNear(p.lat, p.lng, 45).length + ' guide(s) work near here.');
      };
    });
    rEl.querySelectorAll('[data-guide]').forEach(function(b){
      b.onclick = function(){ closeResults(); qEl.blur(); openGuide(b.dataset.guide); };
    });
  }

  /* =========================================================
     6. Join with code
     ========================================================= */
  /* ---- deep links ----
     explore.html?room=xxx   an old walk-code link: the walk page works out
                             whether you have a request with that guide
     explore.html?guide=g-id opens that guide (profiles, interest.html) */
  var params = new URLSearchParams(location.search);
  var pre = params.get('room');
  if (pre){ location.replace(LT.watchUrl(pre)); return; }

  // The map only loads guides who are walking now, but a profile's "Book a
  // walk" button must work for one who isn't — so wait for the directory,
  // then ask for that one guide if they are not in it.
  var wanted = params.get('guide');
  if (wanted){
    dataReady.then(function(){
      return LT.guide(wanted) ||
        LT.api('GET', '/api/guides/' + encodeURIComponent(wanted))
          .then(function(d){ return LT.adaptGuide(d.guide); })
          .catch(function(){ return null; });
    }).then(function(g){
      if (!g) return LT.toast('That guide isn’t available any more.', 'bad');
      // wait for the arrival flight so the sheet doesn't fight the camera
      setTimeout(function(){ openGuideRow(g); }, reduced ? 200 : 1400);
    });
  }

  /* =========================================================
     7. Chrome
     ========================================================= */
  $('liveCount').textContent = LT.liveGuides().length;
}).catch(function(e){ if (!e || !e.redirecting) console.error(e); });
</script>
</body>
</html>
