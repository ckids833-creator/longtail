<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12181B">
<title>Longtail Live</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12181B; --ink-2:#1B2327; --ink-3:#232C31;
    --saffron:#E8A33D; --chili:#D2472B; --signal:#46D189;
    --paper:#EFE7D8; --dim:rgba(239,231,216,.6); --faint:rgba(239,231,216,.32);
    --line:rgba(239,231,216,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;height:100%;overscroll-behavior:none;}
  button{font-family:inherit;color:inherit;border:none;cursor:pointer;}
  input{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',monospace;}
  :focus-visible{outline:2px solid var(--saffron);outline-offset:2px;}

  /* ---------- lobby ---------- */
  #lobby{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;max-width:440px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
  .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--chili),var(--saffron));display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:900;color:var(--ink);font-size:16px;}
  .brand span{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:21px;letter-spacing:.03em;}
  h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;text-transform:uppercase;font-size:34px;line-height:.95;margin-bottom:8px;}
  .lede{font-size:14px;color:var(--dim);line-height:1.6;margin-bottom:24px;}

  label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 7px;}
  .in{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:14px 15px;color:var(--paper);font-size:15px;}
  .in:focus{outline:none;border-color:var(--saffron);}
  .roles{display:flex;gap:9px;}
  .role{flex:1;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:15px 10px;text-align:center;}
  .role.on{border-color:var(--saffron);background:rgba(232,163,61,.1);}
  .role b{display:block;font-size:14px;font-weight:700;margin-bottom:3px;}
  .role small{font-size:11.5px;color:var(--dim);line-height:1.4;display:block;}
  .role.on b{color:var(--saffron);}

  .btn{width:100%;padding:16px;border-radius:13px;font-weight:700;font-size:15px;margin-top:22px;background:var(--saffron);color:var(--ink);}
  .btn:disabled{background:var(--ink-3);color:var(--faint);cursor:not-allowed;}

  .share{margin-top:20px;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:15px;display:none;}
  .share.on{display:block;}
  .share p{font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:9px;}
  .share .link{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--saffron);word-break:break-all;line-height:1.5;}
  .copy{margin-top:10px;background:var(--ink-3);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;font-size:13px;font-weight:600;}

  .err{background:rgba(210,71,43,.12);border:1px solid rgba(210,71,43,.4);border-radius:11px;padding:13px 15px;font-size:13px;line-height:1.55;margin-top:16px;display:none;}
  .err.on{display:block;}

  /* ---------- live ---------- */
  #live{display:none;position:fixed;inset:0;background:#000;}
  #live.on{display:block;}
  #remoteVideo,#localVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
  #selfPip{position:absolute;top:74px;right:14px;width:88px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid rgba(239,231,216,.25);display:none;z-index:6;}

  .top{position:absolute;top:0;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(14px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);}
  .pill{background:rgba(10,15,17,.6);backdrop-filter:blur(6px);border-radius:10px;padding:7px 11px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.04em;}
  .pill b{display:block;font-size:15px;color:var(--paper);margin-top:2px;}
  .pill b.money{color:var(--saffron);}
  .pill b.good{color:var(--signal);}
  .pills{display:flex;gap:7px;}
  .livedot{display:flex;align-items:center;gap:6px;background:rgba(10,15,17,.6);backdrop-filter:blur(6px);border-radius:999px;padding:7px 12px 7px 9px;font-family:'JetBrains Mono',monospace;font-size:10px;}
  .livedot i{width:6px;height:6px;border-radius:50%;background:#ff5a4e;animation:pd 1.4s infinite;}
  @keyframes pd{0%{box-shadow:0 0 0 0 rgba(255,90,78,.6);}70%{box-shadow:0 0 0 8px rgba(255,90,78,0);}100%{box-shadow:0 0 0 0 rgba(255,90,78,0);}}

  .waiting{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;z-index:4;}
  .waiting.hide{display:none;}
  .spinner{width:34px;height:34px;border:3px solid rgba(239,231,216,.15);border-top-color:var(--saffron);border-radius:50%;animation:sp .9s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .waiting p{font-size:14px;color:var(--dim);line-height:1.6;max-width:26ch;}

  /* guide prompt — the whole point */
  .prompt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;background:rgba(232,163,61,.96);color:var(--ink);border-radius:18px;padding:22px 24px;max-width:min(320px,82vw);text-align:center;box-shadow:0 22px 50px -14px rgba(0,0,0,.7);display:none;}
  .prompt.on{display:block;animation:pop .28s ease-out;}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.93);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}
  .prompt .who{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.09em;opacity:.65;margin-bottom:7px;}
  .prompt .what{font-size:18px;font-weight:700;line-height:1.35;}

  .bottom{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:16px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.6),transparent);display:flex;flex-direction:column;gap:11px;}
  .presets{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
  .preset{background:rgba(10,15,17,.62);backdrop-filter:blur(6px);border:1px solid rgba(239,231,216,.22);border-radius:999px;padding:9px 14px;font-size:12.5px;}
  .preset:active{background:rgba(239,231,216,.2);}
  .composer{display:flex;gap:8px;}
  .composer input{flex:1;background:rgba(10,15,17,.62);backdrop-filter:blur(6px);border:1px solid rgba(239,231,216,.22);border-radius:12px;padding:13px 15px;color:var(--paper);font-size:14px;}
  .composer input:focus{outline:none;border-color:var(--saffron);}
  .composer button{background:var(--saffron);color:var(--ink);border-radius:12px;padding:0 18px;font-weight:700;font-size:14px;}
  .ctrls{display:flex;gap:9px;}
  .ctrl{flex:1;background:rgba(10,15,17,.62);backdrop-filter:blur(6px);border:1px solid rgba(239,231,216,.22);border-radius:12px;padding:13px 0;font-size:12.5px;font-weight:600;text-align:center;}
  .ctrl.off{color:var(--chili);border-color:rgba(210,71,43,.5);}
  .ctrl.leave{background:var(--chili);color:var(--paper);border-color:transparent;}

  .toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top));z-index:9;background:rgba(10,15,17,.9);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:12.5px;display:none;}
  .toast.on{display:block;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>

<!-- ================= LOBBY ================= -->
<div id="lobby">
  <div class="brand"><div class="mark">L</div><span>LONGTAIL LIVE</span></div>
  <h1>Join a walk</h1>
  <p class="lede">Two people, one street. The guide carries the camera; the traveler steers.</p>

  <label>Your name</label>
  <input class="in" id="fName" placeholder="Porsche" autocomplete="off">

  <label>Walk code</label>
  <input class="in" id="fRoom" placeholder="yaowarat-01" autocomplete="off">

  <label>You are the</label>
  <div class="roles">
    <button class="role on" data-role="guide"><b>Guide</b><small>Camera + mic, on the street</small></button>
    <button class="role" data-role="traveler"><b>Traveler</b><small>Watching, mic only</small></button>
  </div>

  <button class="btn" id="btnJoin">Join walk</button>

  <div class="share" id="shareBox">
    <p>Send this to your traveler — they join in a browser, no app, no account.</p>
    <div class="link" id="shareLink"></div>
    <button class="copy" id="btnCopy">Copy traveler link</button>
  </div>

  <div class="err" id="errBox"></div>
</div>

<!-- ================= LIVE ================= -->
<div id="live">
  <video id="remoteVideo" playsinline autoplay></video>
  <video id="localVideo" playsinline autoplay muted></video>
  <video id="selfPip" playsinline autoplay muted></video>

  <div class="waiting" id="waitBox">
    <div class="spinner"></div>
    <p id="waitTxt">Connecting…</p>
  </div>

  <div class="top">
    <div class="livedot"><i></i><span id="roleTag">LIVE</span></div>
    <div class="pills">
      <div class="pill">TIME<b class="mono" id="tTime">00:00</b></div>
      <div class="pill" id="moneyPill">COST<b class="mono money" id="tMoney">฿0</b></div>
      <div class="pill">NET<b class="mono good" id="tNet">—</b></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="prompt" id="promptBox">
    <div class="who" id="promptWho">Traveler says</div>
    <div class="what" id="promptWhat"></div>
  </div>

  <div class="bottom">
    <!-- traveler-only -->
    <div id="travelerCtrls" style="display:none;flex-direction:column;gap:11px;">
      <div class="presets">
        <button class="preset">Get closer</button>
        <button class="preset">Turn around</button>
        <button class="preset">Look up</button>
        <button class="preset">Stay here</button>
        <button class="preset">What is that?</button>
      </div>
      <div class="composer">
        <input id="msgIn" placeholder="Tell them where to go…" autocomplete="off">
        <button id="msgSend">Send</button>
      </div>
    </div>

    <div class="ctrls">
      <button class="ctrl" id="cMic">Mute</button>
      <button class="ctrl" id="cFlip" style="display:none;">Flip camera</button>
      <button class="ctrl leave" id="cLeave">Leave</button>
    </div>
  </div>
</div>

<script>
const LK = window.LivekitClient;
const RATE = 15;            // ฿/min — change to match your test
const FEE  = 0.12;

let room = null, role = 'guide', myName = '', roomCode = '';
let secs = 0, timerInt = null, promptTimeout = null;
let facing = 'environment', micOn = true;

const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

/* ---------- prefill from URL: ?room=xxx&role=traveler ---------- */
const qs = new URLSearchParams(location.search);
if (qs.get('room')) $('fRoom').value = qs.get('room');
if (qs.get('role') === 'traveler') setRole('traveler');

function setRole(r){
  role = r;
  document.querySelectorAll('.role').forEach(b => b.classList.toggle('on', b.dataset.role === r));
}
document.querySelectorAll('.role').forEach(b => b.addEventListener('click', () => setRole(b.dataset.role)));

/* show the shareable traveler link as soon as there's a code */
$('fRoom').addEventListener('input', () => {
  const code = $('fRoom').value.trim();
  if (code.length >= 3 && role === 'guide') {
    const link = `${location.origin}${location.pathname}?room=${encodeURIComponent(code)}&role=traveler`;
    $('shareLink').textContent = link;
    $('shareBox').classList.add('on');
  } else {
    $('shareBox').classList.remove('on');
  }
});
$('btnCopy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('shareLink').textContent);
    $('btnCopy').textContent = 'Copied';
    setTimeout(() => $('btnCopy').textContent = 'Copy traveler link', 1800);
  } catch { showErr('Copy failed — select the link and copy it by hand.'); }
});

function showErr(msg){ $('errBox').textContent = msg; $('errBox').classList.add('on'); }
function toast(msg, ms = 2600){
  $('toast').textContent = msg; $('toast').classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => $('toast').classList.remove('on'), ms);
}

/* ================= JOIN ================= */
$('btnJoin').addEventListener('click', join);

async function join(){
  myName   = $('fName').value.trim();
  roomCode = $('fRoom').value.trim();
  if (!myName)   return showErr('Put your name in first.');
  if (roomCode.length < 3) return showErr('Walk code needs at least 3 characters. Both of you must type the same one.');

  $('errBox').classList.remove('on');
  $('btnJoin').disabled = true;
  $('btnJoin').textContent = 'Connecting…';

  try {
    const res = await fetch('/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: roomCode, name: myName, role })
    });
    if (!res.ok) throw new Error((await res.json()).error || 'Token request failed');
    const { token, url } = await res.json();

    room = new LK.Room({
      adaptiveStream: true,
      dynacast: true,
      videoCaptureDefaults: {
        facingMode: 'environment',
        resolution: LK.VideoPresets.h540.resolution   // 540p — kinder to phone battery and Thai mobile data
      },
      publishDefaults: {
        videoEncoding: { maxBitrate: 1_200_000, maxFramerate: 24 },
        simulcast: true
      }
    });

    wireRoom();
    await room.connect(url, token);

    $('lobby').style.display = 'none';
    $('live').classList.add('on');
    $('roleTag').textContent = role === 'guide' ? 'YOU ARE FILMING' : 'WATCHING';

    if (role === 'guide') {
      await room.localParticipant.setCameraEnabled(true);
      await room.localParticipant.setMicrophoneEnabled(true);
      $('cFlip').style.display = 'block';
      $('moneyPill').querySelector('.mono').id = 'tMoney';
      // guide sees their own camera full-screen
      attachLocalVideo();
      keepAwake();
    } else {
      await room.localParticipant.setMicrophoneEnabled(true);
      $('travelerCtrls').style.display = 'flex';
      $('localVideo').style.display = 'none';
    }

    startTimer();
  } catch (e) {
    console.error(e);
    showErr(e.message.includes('token')
      ? 'Could not get a token — is the server running with your LiveKit keys?'
      : `Connection failed: ${e.message}`);
    $('btnJoin').disabled = false;
    $('btnJoin').textContent = 'Join walk';
  }
}

/* ================= ROOM EVENTS ================= */
function wireRoom(){
  room
    .on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === 'video') {
        track.attach($('remoteVideo'));
        $('waitBox').classList.add('hide');
        if (role === 'traveler') toast('Connected — you can hear and steer them now');
      }
      if (track.kind === 'audio') {
        const el = track.attach();
        el.style.display = 'none';
        document.body.appendChild(el);
      }
    })
    .on(LK.RoomEvent.ParticipantConnected, (p) => {
      toast(`${p.name || 'Someone'} joined`);
      if (role === 'guide') $('waitBox').classList.add('hide');
    })
    .on(LK.RoomEvent.ParticipantDisconnected, (p) => {
      toast(`${p.name || 'They'} left the walk`);
      $('waitTxt').textContent = 'They dropped out. Waiting for them to come back…';
      $('waitBox').classList.remove('hide');
    })
    .on(LK.RoomEvent.DataReceived, (payload, participant) => {
      try {
        const msg = JSON.parse(dec.decode(payload));
        if (msg.type === 'direction') showPrompt(msg.text, participant?.name || 'Traveler');
      } catch {}
    })
    .on(LK.RoomEvent.ConnectionQualityChanged, (quality, p) => {
      if (p?.isLocal && quality === LK.ConnectionQuality.Poor) toast('Weak signal here — slow down or move');
    })
    .on(LK.RoomEvent.Reconnecting, () => { $('waitTxt').textContent = 'Signal dropped — reconnecting…'; $('waitBox').classList.remove('hide'); })
    .on(LK.RoomEvent.Reconnected, () => { $('waitBox').classList.add('hide'); toast('Back online'); })
    .on(LK.RoomEvent.Disconnected, () => leave(true));
}

function attachLocalVideo(){
  const pub = room.localParticipant.getTrackPublication(LK.Track.Source.Camera);
  if (pub?.track) pub.track.attach($('localVideo'));
  $('waitTxt').textContent = 'Streaming. Waiting for your traveler to join…';
}

/* ================= PROMPTS ================= */
function sendDirection(text){
  if (!text.trim() || !room) return;
  room.localParticipant.publishData(
    enc.encode(JSON.stringify({ type: 'direction', text: text.trim() })),
    { reliable: true }
  );
  showPrompt(text.trim(), 'You');       // echo locally so traveler sees it landed
}

function showPrompt(text, who){
  $('promptWho').textContent = who === 'You' ? 'You said' : `${who} says`;
  $('promptWhat').textContent = text;
  $('promptBox').classList.add('on');
  if (navigator.vibrate && role === 'guide') navigator.vibrate(60);
  clearTimeout(promptTimeout);
  promptTimeout = setTimeout(() => $('promptBox').classList.remove('on'), 8000);
}

document.querySelectorAll('.preset').forEach(b =>
  b.addEventListener('click', () => sendDirection(b.textContent)));
$('msgSend').addEventListener('click', () => { sendDirection($('msgIn').value); $('msgIn').value = ''; });
$('msgIn').addEventListener('keydown', e => {
  if (e.key === 'Enter') { sendDirection($('msgIn').value); $('msgIn').value = ''; }
});

/* ================= METERS ================= */
function startTimer(){
  timerInt = setInterval(() => {
    secs++;
    $('tTime').textContent = fmt(secs);
    const gross = Math.round(secs * (RATE / 60));
    $('tMoney').textContent = '฿' + gross;
    $('tNet').textContent = role === 'guide' ? '฿' + Math.round(gross * (1 - FEE)) : '—';
  }, 1000);
}

/* ================= CONTROLS ================= */
$('cMic').addEventListener('click', async () => {
  micOn = !micOn;
  await room.localParticipant.setMicrophoneEnabled(micOn);
  $('cMic').textContent = micOn ? 'Mute' : 'Unmute';
  $('cMic').classList.toggle('off', !micOn);
});

$('cFlip').addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try {
    await room.localParticipant.setCameraEnabled(false);
    await room.localParticipant.setCameraEnabled(true, { facingMode: facing });
    attachLocalVideo();
    toast(facing === 'environment' ? 'Rear camera — the street' : 'Front camera — your face');
  } catch { toast('Could not switch camera'); }
});

$('cLeave').addEventListener('click', () => leave());

async function leave(already){
  clearInterval(timerInt);
  releaseAwake();
  if (room && !already) await room.disconnect();
  const gross = Math.round(secs * (RATE / 60));
  alert(
    `Walk finished\n\n` +
    `Time: ${fmt(secs)}\n` +
    `Traveler charged: ฿${gross}\n` +
    `Guide earns: ฿${Math.round(gross * (1 - FEE))}\n\n` +
    `Write your debrief now, while it's fresh.`
  );
  location.href = location.pathname;
}

/* ================= KEEP SCREEN ON ================= */
let wakeLock = null;
async function keepAwake(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
function releaseAwake(){ if (wakeLock) { wakeLock.release(); wakeLock = null; } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && role === 'guide' && room) keepAwake();
});
window.addEventListener('beforeunload', e => { if (room) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
